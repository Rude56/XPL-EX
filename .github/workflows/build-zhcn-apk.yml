name: Build zh-CN debug APK

# 只构建 debug 变体，用于本地试用。
#
# 为什么要在 CI 里现场生成一个临时 keystore：
#   app/build.gradle 的签名配置是这样写的
#       if (System.getenv('GITHUB_WORKSPACE') != null) {
#           storeFile file("${System.getenv('GITHUB_WORKSPACE')}/KEYSTORE.JKS")
#       }
#   而 GITHUB_WORKSPACE 在 Actions 里永远存在，所以这个分支恒为真，
#   Gradle 会去读仓库根目录的 KEYSTORE.JKS。仓库里没有这个文件，打包就会
#   报 "storeFile ... which doesn't exist"。
#   因此这里用 keytool 现场造一个一次性 keystore，只用于产出可安装的 APK，
#   不涉及上游的发布签名，也不需要仓库里配置任何 Secrets。
#
# 注意：这样产出的 APK 签名与上游 release 不同，不能覆盖安装官方版本。

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn-localization
      - add-apk-workflow

jobs:
  build-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          SDKM="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          "${SDKM}" --install "platforms;android-36" "build-tools;35.0.0" >/dev/null
          yes | "${SDKM}" --licenses >/dev/null 2>&1 || true

      - name: Restore the fixed signing keystore
        run: |
          set -euo pipefail
          # 用仓库内的固定 keystore，保证每次构建签名一致。
          # 这样新 APK 可以直接覆盖安装旧版，不必卸载、不丢配置。
          base64 -d app/keystore/zhcn-release.jks.b64 > "${GITHUB_WORKSPACE}/KEYSTORE.JKS"
          test -f "${GITHUB_WORKSPACE}/KEYSTORE.JKS"
          {
            echo "KEYSTORE_PASSWORD=xplzh2026"
            echo "KEY_ALIAS=xplzh"
            echo "KEY_PASSWORD=xplzh2026"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show APK info
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK: ${APK}"
          ls -lh "${APK}"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2" dump badging "${APK}" | head -n 5 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xpl-ex-next-zhcn-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 7
