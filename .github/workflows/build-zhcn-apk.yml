name: Build zh-CN debug APK

# 只构建 debug 变体用于本地试用：
#   - debug 不需要签名密钥（app/build.gradle 里 signingConfigs 只在
#     GITHUB_WORKSPACE 存在时才读取 KEYSTORE.JKS，这里刻意不提供）
#   - 不跑 assembleRelease，避免触发需要在仓库 Secrets 里配置的签名流程
#
# 触发方式：手动运行，或推送到 zh-cn-localization 分支时自动运行。

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn-localization

jobs:
  build-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          SDKM="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          # 项目 compileSdk 36 / buildToolsVersion 35.0.0
          "${SDKM}" --install "platforms;android-36" "build-tools;35.0.0" >/dev/null
          yes | "${SDKM}" --licenses >/dev/null 2>&1 || true

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show APK info
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK: ${APK}"
          ls -lh "${APK}"
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xpl-ex-next-zhcn-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 7
